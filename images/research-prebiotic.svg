<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Lightning over a primordial ocean on the early Earth, with prebiotic molecules forming">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c2e"/>
      <stop offset="0.55" stop-color="#4a1f5c"/>
      <stop offset="1" stop-color="#c8573a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4a5c"/>
      <stop offset="1" stop-color="#0b1c26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9c8ff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#9b6bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="800" height="440" fill="url(#sky)"/>
  <circle cx="640" cy="300" r="120" fill="url(#sun)"/>

  <!-- clouds -->
  <g fill="#0e0820" opacity="0.75">
    <ellipse cx="250" cy="40" rx="260" ry="55"/>
    <ellipse cx="470" cy="30" rx="200" ry="45"/>
    <ellipse cx="120" cy="70" rx="160" ry="38"/>
  </g>

  <!-- volcano -->
  <path d="M520 330 L610 236 L636 238 L740 330 Z" fill="#1a0f1f"/>
  <path d="M612 236 Q600 180 640 140 Q660 110 630 80" fill="none" stroke="#3a2a40" stroke-width="26" stroke-linecap="round" opacity="0.6"/>
  <ellipse cx="623" cy="238" rx="14" ry="4" fill="#ff7a3d"/>

  <!-- sea -->
  <rect y="322" width="800" height="118" fill="url(#sea)"/>
  <g stroke="#3f7b8f" stroke-width="2" opacity="0.5" fill="none">
    <path d="M40 350 q20 -6 40 0 t40 0"/>
    <path d="M300 372 q20 -6 40 0 t40 0"/>
    <path d="M560 360 q20 -6 40 0 t40 0"/>
    <path d="M160 405 q20 -6 40 0 t40 0"/>
  </g>

  <!-- lightning -->
  <circle cx="300" cy="322" r="70" fill="url(#glow)"/>
  <path d="M262 50 L238 150 L276 150 L246 236 L286 236 L300 322" fill="none" stroke="#b48cff" stroke-width="16" stroke-linejoin="round" filter="url(#blur)" opacity="0.9"/>
  <path d="M262 50 L238 150 L276 150 L246 236 L286 236 L300 322" fill="none" stroke="#f4eeff" stroke-width="5" stroke-linejoin="round"/>
  <path d="M276 150 L318 196 M246 236 L214 276" fill="none" stroke="#e6dbff" stroke-width="2.5" opacity="0.85"/>

  <!-- molecules: HCN -->
  <g transform="translate(410 120)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#d8d8d8" stroke-width="4"/>
    <g stroke="#d8d8d8" stroke-width="3"><line x1="34" y1="-6" x2="74" y2="-6"/><line x1="34" y1="0" x2="74" y2="0"/><line x1="34" y1="6" x2="74" y2="6"/></g>
    <circle cx="0" cy="0" r="9" fill="#f2f2f2"/>
    <circle cx="34" cy="0" r="14" fill="#4b4b55" stroke="#9a9aa6" stroke-width="1.5"/>
    <circle cx="74" cy="0" r="14" fill="#5b7cff"/>
  </g>
  <text x="440" y="158" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e9defc" opacity="0.9">HCN</text>

  <!-- glycine skeleton -->
  <g transform="translate(90 210)" stroke="#d8d8d8" stroke-width="4">
    <line x1="0" y1="0" x2="38" y2="-22"/>
    <line x1="38" y1="-22" x2="78" y2="0"/>
    <line x1="78" y1="0" x2="78" y2="44"/>
    <line x1="78" y1="0" x2="114" y2="-22"/>
    <line x1="82" y1="0" x2="82" y2="44" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#5b7cff" stroke="none"/>
    <circle cx="38" cy="-22" r="14" fill="#4b4b55" stroke="#9a9aa6" stroke-width="1.5"/>
    <circle cx="78" cy="0" r="14" fill="#4b4b55" stroke="#9a9aa6" stroke-width="1.5"/>
    <circle cx="80" cy="44" r="13" fill="#ff5a5a" stroke="none"/>
    <circle cx="114" cy="-22" r="13" fill="#ff5a5a" stroke="none"/>
  </g>
  <text x="96" y="285" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e9defc" opacity="0.9">glycine</text>

  <!-- small species -->
  <g>
    <circle cx="380" cy="250" r="8" fill="#4b4b55" stroke="#9a9aa6" stroke-width="1.5"/>
    <circle cx="396" cy="244" r="6" fill="#f2f2f2"/><circle cx="366" cy="242" r="6" fill="#f2f2f2"/><circle cx="380" cy="266" r="6" fill="#f2f2f2"/><circle cx="388" cy="236" r="6" fill="#f2f2f2"/>
    <circle cx="190" cy="120" r="7" fill="#5b7cff"/><circle cx="206" cy="120" r="7" fill="#5b7cff"/>
    <circle cx="520" cy="200" r="7" fill="#ff5a5a"/><circle cx="532" cy="190" r="5" fill="#f2f2f2"/><circle cx="532" cy="210" r="5" fill="#f2f2f2"/>
    <circle cx="350" cy="90" r="2.5" fill="#f4eeff"/><circle cx="330" cy="200" r="2" fill="#f4eeff"/><circle cx="220" cy="300" r="2.5" fill="#f4eeff"/><circle cx="345" cy="290" r="2" fill="#f4eeff"/>
  </g>
</svg>
