# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: The Multiscale Computational Plasma Lab
tagline: UCLA
email: vialetto@ucla.edu
description: > # this means to ignore newlines until "baseurl:"
  The Multiscale Computational Plasma Lab at UCLA, led by Prof. Luca Vialetto,
  develops multiscale and multiphysics models for electric propulsion,
  semiconductor plasma processing, and plasma-material interactions.
baseurl: ""
url: "https://vialettoplasmalab.org"

author: Luca Vialetto
logo: /images/logo.png

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
